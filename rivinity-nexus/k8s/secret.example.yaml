apiVersion: v1
kind: Secret
metadata:
  name: rivinity-secrets
  namespace: rivinity
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace_me"
  DATABASE_URL: "postgresql+psycopg://rivinity:replace_me@postgres:5432/rivinity_nexus"
  JWT_SECRET_KEY: "replace_me_with_secure_secret"
  GPU_VENDOR_API_TOKEN: "replace_me"
  API_KEY_HEADER_NAME: "X-API-Key"
