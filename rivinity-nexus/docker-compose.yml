version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rivinity-api
    command: uvicorn rivinity_nexus.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://rivinity:rivinity_password@database:5432/rivinity_nexus
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - model_data:/app/storage/models
      - dataset_data:/app/storage/datasets

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rivinity-worker
    command: celery -A rivinity_nexus.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://rivinity:rivinity_password@database:5432/rivinity_nexus
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - model_data:/app/storage/models
      - dataset_data:/app/storage/datasets

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rivinity-scheduler
    command: celery -A rivinity_nexus.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg://rivinity:rivinity_password@database:5432/rivinity_nexus
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  database:
    image: postgres:16
    container_name: rivinity-database
    environment:
      POSTGRES_DB: rivinity_nexus
      POSTGRES_USER: rivinity
      POSTGRES_PASSWORD: rivinity_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivinity -d rivinity_nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rivinity-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
  model_data:
  dataset_data:
